# Netlify hosts the demo: a static single-page build whose /api calls are answered in the browser from sample
# data (app/demo/). No server, no Fellow account, no brewer. `AIDEN_DEMO=1` is what makes the build a demo.
# Node comes from .nvmrc; pnpm from the packageManager field in package.json.

[build]
  command = "pnpm run build:demo"
  publish = ".output/public"

[build.environment]
  AIDEN_DEMO = "1"
  NODE_VERSION = "22"

# There is no API in a demo build. Say so, rather than letting the redirect below answer with the page itself,
# which anything expecting JSON would choke on.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# A single-page app: every other path is served by the one page, which then routes in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # A static build starts itself from an inline script that carries the app's configuration, so scripts need
    # 'unsafe-inline' here. That is safe for this page and nowhere else: the demo has no accounts, no input from
    # anyone, and no data worth reaching. The real app keeps its strict, nonce-based policy, which it can because
    # it has a server to generate the nonces.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The built assets are content-hashed, so they can be cached hard.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
