# Netlify hosts the demo: a static single-page build whose /api calls are answered in the browser from sample
# data (app/demo/). No server, no Fellow account, no brewer. `AIDEN_DEMO=1` is what makes the build a demo.
# Node comes from .nvmrc; pnpm from the packageManager field in package.json.

[build]
  command = "pnpm run build:demo"
  publish = ".output/public"

[build.environment]
  AIDEN_DEMO = "1"
  NODE_VERSION = "22"

# A single-page app: every path is served by the one page, which then routes in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The built assets are content-hashed, so they can be cached hard.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
